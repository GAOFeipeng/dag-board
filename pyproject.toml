[project]
name = "dagboard"
version = "0.1.0"
description = "Local ComfyUI-style causal DAG workflow canvas for official discovery baselines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DAGBoard contributors" }]
keywords = ["causal-discovery", "dag", "workflow", "react-flow", "fastapi"]
dependencies = [
    "fastapi>=0.124.4",
    "uvicorn[standard]>=0.33.0",
    "pydantic>=2.10.6",
    "python-multipart>=0.0.20",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "gcastle>=1.0.4",
    "dagma>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.1",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dag_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
